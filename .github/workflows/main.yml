name: Obsidian Citadel CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-notify-0.7
        pip install psutil ruff

    - name: Static Analysis
      run: ruff check switcher/

    - name: Run Tests
      run: python -m unittest discover -s tests
