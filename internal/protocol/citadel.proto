syntax = "proto3";

package citadel.v1;

import "google/protobuf/timestamp.proto";

// ── Service Definition ──────────────────────────────────────────────────

service CitadelService {
  // Mode Management
  rpc SetProfile(SetProfileRequest) returns (ProfileResponse);
  rpc GetCurrentState(StateRequest) returns (SystemState);
  
  // High-Speed Telemetry Stream
  rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetryPulse);
}

// ── Messages ────────────────────────────────────────────────────────────

message SetProfileRequest {
  string profile_name = 1;
  bool force = 2;
}

message ProfileResponse {
  bool success = 1;
  string message = 2;
  google.protobuf.Timestamp applied_at = 3;
}

message StateRequest {}

message SystemState {
  string active_profile = 1;
  map<string, bool> active_services = 2;
  float uptime_seconds = 3;
}

message TelemetryRequest {
  int32 interval_ms = 1;
}

message TelemetryPulse {
  google.protobuf.Timestamp timestamp = 1;
  CPUHeatmap cpu = 2;
  GPUVitals gpu = 3;
  RAMVitals ram = 4;
  float disk_pressure = 5;
  float net_speed_bytes_sec = 6;
  string top_process = 7;
}

message CPUHeatmap {
  repeated float core_usage = 1;
}

message GPUVitals {
  float temperature = 1;
  float power_draw_watts = 2;
  int64 vram_used_bytes = 3;
  int64 vram_total_bytes = 4;
  float utilization_percent = 5;
  float fan_speed_percent = 6;
}

message RAMVitals {
  int64 used_bytes = 1;
  int64 total_bytes = 2;
}
